<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>短線波段實戰儀表板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { display: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 80px); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">

    <!-- 頂部 -->
    <header class="bg-white shadow-sm px-4 py-3 flex justify-between items-center z-10 sticky top-0">
        <select id="userSelect" class="bg-gray-100 border-none text-gray-800 text-sm rounded-lg focus:ring-0 font-bold py-1.5 px-2" onchange="switchUser(this.value)">
        </select>
        <div class="flex space-x-3 items-center">
            <button onclick="exportData()" class="text-xs bg-gray-200 text-gray-700 px-3 py-1.5 rounded-full font-semibold hover:bg-gray-300">匯出</button>
            <button id="marketToggle" onclick="toggleMarket()" class="px-4 py-1.5 rounded-full text-white text-xs font-bold bg-blue-600 shadow-md transition-colors duration-300">
                🇹🇼 台股模式
            </button>
        </div>
    </header>

    <div id="backupAlert" class="hidden bg-yellow-100 text-yellow-800 text-xs text-center py-2 font-semibold shadow-inner">
        ⚠️ 您的資料已超過 7 天未備份，請盡速匯出。
    </div>

    <main class="flex-1 overflow-y-auto p-4 pb-safe">
        
        <!-- ================= 頁籤 1: 總覽 ================= -->
        <div id="view-dashboard" class="tab-content active space-y-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-2">
                    <p class="text-sm text-gray-500 font-semibold">總資產現值 <span id="assetCurrencyLabel">(TWD)</span></p>
                    <button onclick="openModal('editAssets')" class="text-xs text-blue-600 underline">修改本金</button>
                </div>
                <div class="flex items-end mb-4">
                    <p id="totalAssets" class="text-3xl font-black text-gray-900">$0</p>
                    <p id="totalAssetsTwdEq" class="text-sm text-gray-400 font-bold ml-2 mb-1 hidden">(約 NT$ 0)</p>
                </div>
                
                <div class="grid grid-cols-2 gap-4 border-t pt-4">
                    <div>
                        <p class="text-xs text-gray-500 mb-1">可用閒置資金</p>
                        <p id="cashAssets" class="text-lg font-bold text-green-600">$0</p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-1">持股現值 (未實現)</p>
                        <p id="investedAssets" class="text-lg font-bold text-blue-600">$0</p>
                    </div>
                </div>
            </div>

            <!-- 績效統整區 -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 mb-1">歷史勝率</p>
                    <p id="winRate" class="text-2xl font-black text-gray-800">0%</p>
                </div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-center">
                    <p class="text-xs text-gray-500 mb-1">累積淨利 (已平倉)</p>
                    <p id="netProfit" class="text-2xl font-black text-gray-800">$0</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-3">當前市場部位現值</h3>
                <canvas id="assetChart" height="200"></canvas>
            </div>

            <h2 class="text-lg font-bold text-gray-800 mt-6 mb-3">歷史交易紀錄</h2>
            <div id="historyList" class="space-y-3 pb-10"></div>
        </div>

        <!-- ================= 頁籤 2: 雷達 ================= -->
        <div id="view-radar" class="tab-content">
            <h2 class="text-lg font-bold mb-4">甜甜價推薦 (Top 10) <span id="radarMarketTitle" class="text-sm text-gray-500"></span></h2>
            <div id="radarList" class="space-y-4 pb-10"></div>
        </div>

        <!-- ================= 頁籤 3: 持股 ================= -->
        <div id="view-portfolio" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">我的持股庫 <span id="portfolioMarketTitle" class="text-sm text-gray-500"></span></h2>
                <button onclick="openModal('addPosition')" class="bg-gray-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow">+ 手動新增</button>
            </div>
            <div id="portfolioList" class="space-y-4 pb-10"></div>
        </div>
    </main>

    <!-- 底部導覽列 -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 w-full flex justify-around items-center px-2 py-2 z-20 pb-4">
        <button onclick="switchTab('dashboard')" class="nav-btn flex flex-col items-center p-2 text-blue-600 w-1/3" data-target="dashboard">
            <span class="text-xl mb-1">📊</span><span class="text-[10px] font-bold">總覽</span>
        </button>
        <button onclick="switchTab('radar')" class="nav-btn flex flex-col items-center p-2 text-gray-400 w-1/3" data-target="radar">
            <span class="text-xl mb-1">🎯</span><span class="text-[10px] font-bold">雷達</span>
        </button>
        <button onclick="switchTab('portfolio')" class="nav-btn flex flex-col items-center p-2 text-gray-400 w-1/3" data-target="portfolio">
            <span class="text-xl mb-1">💼</span><span class="text-[10px] font-bold">持股</span>
        </button>
    </nav>

    <!-- 萬用彈出視窗 -->
    <div id="actionModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl relative">
            <h3 id="modalTitle" class="text-lg font-bold mb-4 text-gray-800">標題</h3>
            <div id="modalContent" class="space-y-4"></div>
            <div class="mt-6 flex space-x-3">
                <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl font-bold">取消</button>
                <button id="modalConfirmBtn" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-bold shadow-md">確認</button>
            </div>
        </div>
    </div>

    <script>
        let currentMarket = 'TW';
        let assetChartInstance = null;
        const FX_RATE = 32.5; 

        const mockRadarData = {
            "TW": {
                "2330.TW": { current_price: 940, support: 900, resistance: 985, stop_loss: 882, stars: 4, rr_ratio: 2.5, est_days_min: 3, est_days_max: 6 },
                "2317.TW": { current_price: 180, support: 175, resistance: 195, stop_loss: 171.5, stars: 3, rr_ratio: 1.8, est_days_min: 5, est_days_max: 8 }
            },
            "US": {
                "MU": { current_price: 912.96, support: 890, resistance: 960, stop_loss: 872.2, stars: 5, rr_ratio: 2.6, est_days_min: 4, est_days_max: 7 },
                "NVDA": { current_price: 115, support: 110, resistance: 130, stop_loss: 107.8, stars: 4, rr_ratio: 2.1, est_days_min: 5, est_days_max: 10 }
            }
        };

        const defaultData = {
            currentUser: 'Berice',
            users: {
                'Berice': { cashTW: 0, cashUS: 0, positions: [], history: [], lastBackup: '2026-08-13' },
                'Wendy': { cashTW: 0, cashUS: 0, positions: [], history: [], lastBackup: '2026-08-13' },
                'Jerry': { cashTW: 0, cashUS: 0, positions: [], history: [], lastBackup: '2026-08-13' }
            }
        };

        let appData = JSON.parse(localStorage.getItem('radarData')) || defaultData;
        if(!appData.users['Berice'] || appData.users['Berice'].cashTW === undefined) appData = defaultData;
        let radarData = mockRadarData; 

        window.onload = () => {
            fetch('data.json').then(res => res.json()).then(data => { radarData = data; renderAll(); }).catch(() => renderAll());
            initUserDropdown();
            checkBackupAlert();
        };

        function renderAll() {
            renderDashboard();
            renderRadar();
            renderPortfolio();
        }

        function saveData() { localStorage.setItem('radarData', JSON.stringify(appData)); renderAll(); }
        function switchUser(name) { appData.currentUser = name; saveData(); checkBackupAlert(); }
        
        function toggleMarket() {
            currentMarket = currentMarket === 'TW' ? 'US' : 'TW';
            const btn = document.getElementById('marketToggle');
            if (currentMarket === 'US') {
                btn.className = "px-4 py-1.5 rounded-full text-white text-xs font-bold bg-red-600 shadow-md transition-colors duration-300";
                btn.innerHTML = '🇺🇸 美股模式';
            } else {
                btn.className = "px-4 py-1.5 rounded-full text-white text-xs font-bold bg-blue-600 shadow-md transition-colors duration-300";
                btn.innerHTML = '🇹🇼 台股模式';
            }
            renderAll();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${tabId}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('text-blue-600', btn.dataset.target === tabId);
                btn.classList.toggle('text-gray-400', btn.dataset.target !== tabId);
            });
        }

        function formatMoney(num) {
            return num.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
        }

        // --- 取得持股當前最新報價 (如果 JSON 沒有，則使用買入成本) ---
        function getLivePrice(ticker, cost) {
            if (radarData[currentMarket] && radarData[currentMarket][ticker]) {
                return radarData[currentMarket][ticker].current_price;
            }
            return cost; 
        }

        function renderDashboard() {
            const user = appData.users[appData.currentUser];
            const isUS = currentMarket === 'US';
            const currPrefix = isUS ? '$' : 'NT$';
            
            let currentCash = isUS ? user.cashUS : user.cashTW;
            let currentInvestedValue = 0; 
            
            const marketPositions = user.positions.filter(p => p.market === currentMarket);
            marketPositions.forEach(p => { 
                const livePrice = getLivePrice(p.ticker, p.cost);
                currentInvestedValue += (livePrice * p.shares); 
            });
            
            const totalAssetsValue = currentCash + currentInvestedValue;

            document.getElementById('assetCurrencyLabel').textContent = isUS ? '(USD)' : '(TWD)';
            document.getElementById('totalAssets').textContent = `${currPrefix} ${formatMoney(totalAssetsValue)}`;
            
            const twdEqEl = document.getElementById('totalAssetsTwdEq');
            if(isUS) {
                twdEqEl.textContent = `(約 NT$ ${formatMoney(totalAssetsValue * FX_RATE)})`;
                twdEqEl.classList.remove('hidden');
            } else {
                twdEqEl.classList.add('hidden');
            }

            document.getElementById('cashAssets').textContent = `${currPrefix} ${formatMoney(currentCash)}`;
            document.getElementById('investedAssets').textContent = `${currPrefix} ${formatMoney(currentInvestedValue)}`;

            const marketHistory = user.history.filter(h => h.market === currentMarket);
            let netProfit = 0, wins = 0;
            marketHistory.forEach(h => {
                netProfit += h.pnl;
                if (h.pnl > 0) wins++;
            });
            const winRate = marketHistory.length > 0 ? Math.round((wins / marketHistory.length) * 100) : 0;
            
            const profitEl = document.getElementById('netProfit');
            profitEl.textContent = `${currPrefix} ${formatMoney(netProfit)}`;
            profitEl.className = `text-2xl font-black ${netProfit >= 0 ? 'text-green-600' : 'text-red-500'}`;
            document.getElementById('winRate').textContent = `${winRate}%`;

            const histList = document.getElementById('historyList');
            histList.innerHTML = marketHistory.length === 0 ? '<p class="text-center text-sm text-gray-400 py-4">尚無交易紀錄</p>' : '';
            [...marketHistory].reverse().forEach(h => {
                const isWin = h.pnl >= 0;
                histList.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-gray-100 flex justify-between items-center shadow-sm">
                        <div>
                            <p class="font-bold text-sm">${h.ticker} <span class="text-[10px] text-gray-400 px-1">${h.date}</span></p>
                            <p class="text-xs text-gray-500">買 ${h.cost} ➔ 賣 ${h.sellPrice}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold ${isWin ? 'text-green-600' : 'text-red-500'}">${isWin ? '+' : ''}${formatMoney(h.pnl)}</p>
                        </div>
                    </div>
                `;
            });

            const ctx = document.getElementById('assetChart').getContext('2d');
            if(assetChartInstance) assetChartInstance.destroy();
            
            const labels = ['閒置現金', ...marketPositions.map(p => p.ticker)];
            const dataVals = [currentCash, ...marketPositions.map(p => getLivePrice(p.ticker, p.cost) * p.shares)];
            
            const bgColors = ['#22c55e']; 
            for(let i=0; i<marketPositions.length; i++) {
                bgColors.push(isUS ? `hsl(0, 70%, ${50 + i*15}%)` : `hsl(210, 70%, ${50 + i*15}%)`);
            }

            assetChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: { labels, datasets: [{ data: dataVals, backgroundColor: bgColors, borderWidth: 0 }] },
                options: { cutout: '65%', plugins: { legend: { position: 'right', labels:{boxWidth:10, font:{size: 10}} } } }
            });
        }

        function renderRadar() {
            const list = document.getElementById('radarList');
            const data = radarData[currentMarket] || {};
            list.innerHTML = '';
            
            const user = appData.users[appData.currentUser];
            const currentCash = currentMarket === 'US' ? user.cashUS : user.cashTW;
            
            // 計算目前市場總資產 (用現價)
            let currentInvestedValue = 0;
            user.positions.filter(p=>p.market===currentMarket).forEach(p => {
                currentInvestedValue += (getLivePrice(p.ticker, p.cost) * p.shares);
            });
            const totalAssetsValue = currentCash + currentInvestedValue;
            const riskAmount = totalAssetsValue * 0.02;

            // 篩選大於 3 星，並依照盈虧比排序，最多顯示 10 檔
            const topPicks = Object.entries(data)
                .filter(([_, info]) => info.stars >= 3)
                .sort((a, b) => b[1].rr_ratio - a[1].rr_ratio)
                .slice(0, 10);

            if (topPicks.length === 0) list.innerHTML = '<p class="text-center text-gray-400 text-sm py-10">目前無推薦標的</p>';

            topPicks.forEach(([ticker, info]) => {
                const riskPerShare = info.current_price - info.stop_loss;
                let suggestShares = riskPerShare > 0 ? Math.floor(riskAmount / riskPerShare) : 0;
                if (totalAssetsValue === 0) suggestShares = 0;

                const starStr = '⭐'.repeat(info.stars);
                const currPrefix = currentMarket === 'US' ? 'USD' : 'TWD';

                list.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border-l-4 ${currentMarket==='TW'?'border-blue-500':'border-red-500'}">
                        <div class="flex justify-between mb-2">
                            <div><h3 class="font-bold text-lg text-gray-900">${ticker}</h3><p class="text-xs text-gray-500">${starStr}</p></div>
                            <div class="text-right"><p class="text-xs text-gray-500">現價</p><p class="font-black text-lg">${info.current_price}</p></div>
                        </div>
                        <div class="grid grid-cols-3 gap-2 text-center text-xs mb-3 bg-gray-50 p-2 rounded-xl">
                            <div><p class="text-gray-400">停損</p><p class="font-bold text-red-500">${info.stop_loss}</p></div>
                            <div><p class="text-gray-400">目標</p><p class="font-bold text-green-600">${info.resistance}</p></div>
                            <div><p class="text-gray-400">天數</p><p class="font-bold text-gray-700">${info.est_days_min}~${info.est_days_max}天</p></div>
                        </div>
                        <div class="flex justify-between items-center mt-3">
                            <p class="text-[10px] text-gray-500">${suggestShares > 0 ? `建議買入: ${suggestShares}股<br>總價: ${formatMoney(suggestShares * info.current_price)} ${currPrefix}` : '⚠️ 請先注入資金'}</p>
                            <button onclick="openModal('buy', {ticker: '${ticker}', price: ${info.current_price}, stop: ${info.stop_loss}, target: ${info.resistance}, shares: ${suggestShares}})" class="bg-gray-900 text-white text-xs px-4 py-2 rounded-xl font-bold hover:bg-black">
                                ⚡ 執行買入
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function renderPortfolio() {
            const list = document.getElementById('portfolioList');
            const user = appData.users[appData.currentUser];
            const positions = user.positions.filter(p => p.market === currentMarket);
            list.innerHTML = positions.length === 0 ? '<p class="text-center text-gray-400 text-sm py-10">此市場目前無持股</p>' : '';

            positions.forEach((p) => {
                const realIndex = user.positions.findIndex(item => item === p);
                const livePrice = getLivePrice(p.ticker, p.cost);
                
                // 未實現損益計算
                const unrealizedPnl = (livePrice - p.cost) * p.shares;
                const pnlClass = unrealizedPnl >= 0 ? 'text-green-600' : 'text-red-500';
                const pnlSign = unrealizedPnl >= 0 ? '+' : '';

                const totalRange = p.target - p.stop;
                const currentProgress = totalRange > 0 ? Math.max(0, Math.min(100, ((livePrice - p.stop) / totalRange) * 100)) : 50; 

                list.innerHTML += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 relative overflow-hidden">
                        <div class="flex justify-between items-center mb-3">
                            <div>
                                <div class="flex items-center space-x-2">
                                    <h3 class="font-bold text-lg">${p.ticker}</h3>
                                    <span class="text-xs font-bold ${pnlClass} bg-gray-50 px-2 py-0.5 rounded">${pnlSign}${formatMoney(unrealizedPnl)}</span>
                                </div>
                                <p class="text-xs text-gray-500">股數: ${p.shares} | 成本: ${p.cost} | 現價: ${livePrice}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="deletePosition(${realIndex})" class="bg-gray-100 text-gray-500 text-xs p-2 rounded-lg border border-gray-200 hover:bg-gray-200">🗑️</button>
                                <button onclick="openModal('sell', {index: ${realIndex}, ticker: '${p.ticker}', shares: ${p.shares}, cost: ${p.cost}, livePrice: ${livePrice}})" class="bg-red-50 text-red-600 text-xs px-3 py-2 rounded-lg font-bold border border-red-200">💰 平倉</button>
                            </div>
                        </div>
                        <div class="relative w-full h-2 bg-gray-100 rounded-full mt-4">
                            <div class="absolute h-full ${currentMarket==='TW'?'bg-blue-500':'bg-red-500'} rounded-full transition-all duration-500" style="width: ${currentProgress}%"></div>
                        </div>
                        <div class="flex justify-between text-[10px] text-gray-400 mt-1 font-semibold">
                            <span>停損 ${p.stop}</span>
                            <span>目標 ${p.target}</span>
                        </div>
                    </div>
                `;
            });
        }

        function deletePosition(index) {
            if(confirm('確定要直接刪除這筆持股嗎？\n(注意：資金將以「買入成本」退回閒置現金，不計入歷史損益)')) {
                const user = appData.users[appData.currentUser];
                const p = user.positions[index];
                if(p.market === 'US') user.cashUS += (p.cost * p.shares);
                else user.cashTW += (p.cost * p.shares);
                user.positions.splice(index, 1);
                saveData();
            }
        }

        // --- 手動輸入自動尋找雷達數據 ---
        function autoFillTickerData() {
            const tickerInput = document.getElementById('addTicker').value.toUpperCase();
            if (radarData[currentMarket] && radarData[currentMarket][tickerInput]) {
                const data = radarData[currentMarket][tickerInput];
                document.getElementById('addCost').value = data.current_price;
                document.getElementById('addStop').value = data.stop_loss;
                document.getElementById('addTarget').value = data.resistance;
            }
        }

        function openModal(action, data = null) {
            const title = document.getElementById('modalTitle');
            const content = document.getElementById('modalContent');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const user = appData.users[appData.currentUser];

            if(action === 'editAssets') {
                title.textContent = '修改資金帳戶';
                content.innerHTML = `
                    <div class="space-y-3">
                        <div><label class="text-xs text-gray-500">台幣閒置資金 (TWD)</label><input type="number" id="inputCashTW" class="w-full border p-2 rounded-lg bg-gray-50" value="${user.cashTW}"></div>
                        <div><label class="text-xs text-gray-500">美金閒置資金 (USD)</label><input type="number" id="inputCashUS" class="w-full border p-2 rounded-lg bg-gray-50" value="${user.cashUS}"></div>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-2">修改將直接覆寫您的可用現金餘額。</p>`;
                confirmBtn.onclick = () => {
                    user.cashTW = parseFloat(document.getElementById('inputCashTW').value) || 0;
                    user.cashUS = parseFloat(document.getElementById('inputCashUS').value) || 0;
                    closeModal(); saveData();
                };
            } 
            else if(action === 'addPosition') {
                title.textContent = `手動新增持股 (${currentMarket})`;
                content.innerHTML = `
                    <div class="space-y-3">
                        <input type="text" id="addTicker" onkeyup="autoFillTickerData()" placeholder="輸入代號自動帶入參數" class="w-full border p-2 rounded-lg text-sm bg-gray-50 uppercase font-bold text-blue-600">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" id="addCost" placeholder="成交單價" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                            <input type="number" id="addShares" placeholder="股數" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                            <input type="number" id="addStop" placeholder="設定止損價" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                            <input type="number" id="addTarget" placeholder="設定目標價" class="w-full border p-2 rounded-lg text-sm bg-gray-50">
                        </div>
                    </div>
                `;
                confirmBtn.onclick = () => {
                    const ticker = document.getElementById('addTicker').value.toUpperCase();
                    const cost = parseFloat(document.getElementById('addCost').value);
                    const shares = parseFloat(document.getElementById('addShares').value);
                    const stop = parseFloat(document.getElementById('addStop').value);
                    const target = parseFloat(document.getElementById('addTarget').value);
                    if(!ticker || !cost || !shares) return alert('請填寫完整資訊');
                    
                    if(currentMarket === 'US') user.cashUS -= (cost * shares);
                    else user.cashTW -= (cost * shares);
                    
                    user.positions.push({ ticker, cost, shares, stop, target, market: currentMarket });
                    closeModal(); saveData();
                };
            }
            else if(action === 'buy') {
                title.textContent = `執行買入：${data.ticker}`;
                content.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-xs text-gray-500">買入價</label><input type="number" id="buyPrice" value="${data.price}" class="w-full border p-2 rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">買入股數</label><input type="number" id="buyShares" value="${data.shares}" class="w-full border p-2 rounded-lg"></div>
                    </div>
                `;
                confirmBtn.onclick = () => {
                    const cost = parseFloat(document.getElementById('buyPrice').value);
                    const shares = parseFloat(document.getElementById('buyShares').value);
                    if(shares <= 0) return alert('股數需大於 0');

                    if(currentMarket === 'US') user.cashUS -= (cost * shares);
                    else user.cashTW -= (cost * shares);

                    user.positions.push({ ticker: data.ticker, cost, shares, stop: data.stop, target: data.target, market: currentMarket });
                    closeModal(); saveData(); switchTab('portfolio');
                };
            }
            else if(action === 'sell') {
                title.textContent = `結算平倉：${data.ticker}`;
                content.innerHTML = `
                    <p class="text-xs text-gray-500 mb-3">成本: ${data.cost} | 持股數: ${data.shares}</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-xs text-gray-500">實際賣出價</label><input type="number" id="sellPrice" value="${data.livePrice}" class="w-full border p-2 rounded-lg"></div>
                        <div><label class="text-xs text-gray-500">賣出股數</label><input type="number" id="sellShares" value="${data.shares}" class="w-full border p-2 rounded-lg"></div>
                    </div>
                `;
                confirmBtn.onclick = () => {
                    const sellPrice = parseFloat(document.getElementById('sellPrice').value);
                    const sellShares = parseFloat(document.getElementById('sellShares').value);
                    if(!sellPrice || sellShares > data.shares || sellShares <= 0) return alert('數值輸入錯誤');
                    
                    const pnl = (sellPrice - data.cost) * sellShares;
                    
                    if(currentMarket === 'US') user.cashUS += (sellPrice * sellShares);
                    else user.cashTW += (sellPrice * sellShares);
                    
                    const today = new Date().toISOString().split('T')[0];
                    user.history.push({ ticker: data.ticker, cost: data.cost, sellPrice, pnl, date: today, market: currentMarket });
                    
                    if(sellShares === data.shares) user.positions.splice(data.index, 1);
                    else user.positions[data.index].shares -= sellShares;
                    
                    closeModal(); saveData();
                };
            }
            document.getElementById('actionModal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('actionModal').classList.add('hidden'); }
        function initUserDropdown() {
            const select = document.getElementById('userSelect');
            select.innerHTML = Object.keys(appData.users).map(name => 
                `<option value="${name}" ${name === appData.currentUser ? 'selected' : ''}>👤 ${name}</option>`
            ).join('');
        }
        function exportData() {
            const user = appData.users[appData.currentUser];
            user.lastBackup = new Date().toISOString().split('T')[0];
            saveData();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({[appData.currentUser]: user}));
            const a = document.createElement('a');
            a.href = dataStr; a.download = `${appData.currentUser}_backup.json`;
            a.click(); checkBackupAlert();
        }
        function checkBackupAlert() {
            const lastDate = new Date(appData.users[appData.currentUser].lastBackup);
            const diff = Math.floor((new Date() - lastDate) / (1000 * 60 * 60 * 24));
            document.getElementById('backupAlert').style.display = diff > 7 ? 'block' : 'none';
        }
    </script>
</body>
</html>
