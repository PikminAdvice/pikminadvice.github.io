name: Daily Market Scan (Tier 1)

on:
  schedule:
    - cron: '0 0 * * 1-5' # 週一至週五，UTC 00:00 (台灣早上 08:00)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance pandas numpy lxml html5lib beautifulsoup4
      - name: Run Tier 1 Scan
        run: python daily_scan.py
      - name: Commit candidates
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add candidates.json
          git commit -m "Tier 1: Update candidates" || exit 0
          git push