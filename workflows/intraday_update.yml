name: Intraday Update (Tier 2)

on:
  schedule:
    - cron: '*/30 1-6 * * 1-5'   # 台股時間
    - cron: '*/30 13-20 * * 1-5' # 美股時間
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Run Tier 2 Update
        run: python update_data.py
      - name: Commit live data
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git commit -m "Tier 2: Intraday pulse update" || exit 0
          git push